[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seo-os"
version = "0.1.0"
description = "SEO Operating System — internal platform for managing client SEO"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "loguru>=0.7.0",
    "openai>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "google-api-python-client>=2.130.0",
    "google-auth>=2.29.0",
    "google-analytics-data>=0.18.0",
]

[project.scripts]
seo-os = "cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["cli", "core", "agents", "skills", "integrations", "workflows", "shared", "scheduler", "api"]
